name: Remove certification years

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove certification years
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<div class="cert"><span>Salesforce Certified Administrator</span><b>2023</b></div>': '<div class="cert"><span>Salesforce Certified Administrator</span></div>',
              '<div class="cert"><span>Salesforce Essential Training</span><b>2023</b></div>': '<div class="cert"><span>Salesforce Essential Training</span></div>',
              '<div class="cert"><span>Scrum: The Basics</span><b>2023</b></div>': '<div class="cert"><span>Scrum: The Basics</span></div>',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Certification entry not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove years from certification list'
          git push