name: Update experience badges

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Customer Feedback · Journey Mapping · CX Improvement': 'Customer Experience · Journey Management · Process Improvement',
              'Customer Retention · AI Chatbots · Account Growth': 'Customer Success · Account Growth · AI Solutions',
              'CS Leadership · Client Relationships · Renewals': 'Customer Success Leadership · Retention · Account Management',
              'Customer Onboarding · Requirements · APIs · Cross-selling': 'Customer Onboarding · Adoption · Technical Collaboration',
              'Manual Testing · Test Cases · JIRA · Defect Management': 'Quality Assurance · Testing · Agile Delivery',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Badge not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update experience badges to recruiter-friendly profile'
          git push