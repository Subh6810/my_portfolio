name: Update profile photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point website to latest profile photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('images/profile_pic.png', 'images/profile_new.jpg?v=2')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use latest profile photo'
          git push