name: Update hero summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hero summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Customer Success professional with 8 years of experience across SaaS, conversational AI, mobility and customer experience. I combine customer relationship management, technical problem-solving and cross-functional execution to turn customer needs into measurable outcomes.'
          new = 'Customer Success Manager with 8 years of experience driving client satisfaction and retention. Known for a proactive and adaptable approach to problem-solving. Committed to continuous learning and professional growth, I bring a strong work ethic, decisiveness, and a results-oriented mindset to every project. Adept at managing multiple priorities and meeting strict deadlines while fostering strong client relationships and delivering exceptional service.'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update hero summary to resume profile'
          git push