name: Update Lead CSM experience details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Lead CSM bullets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<ul><li>Owned client relationships with a focus on adoption, retention and satisfaction.</li><li>Led a high-performing team of <b>10–15 Customer Success Managers</b>.</li><li>Managed escalations, renewal commitments, churn strategies and cross-functional prioritisation.</li><li>Introduced training programs, knowledge resources and processes that improved renewal forecasting.</li><li>Recognised for consistently achieving an <b>above 95% MRR renewal rate</b>.</li></ul>'''
          new = '''<ul><li>Communicating with the clients and ensuring proper feedback regarding the product that benefits the organisation, account development, and nurturing the client.</li><li>Directed and developed a high-performing team of <b>10–15 Customer Success Managers</b>, aligning initiatives with organisational goals to drive retention, growth, and operational excellence.</li><li>Own overall relationship with the clients, which includes increasing adoption, ensuring retention and satisfaction.</li><li>Introduced training programs, knowledge base, reference manuals and videos.</li><li>Closely involved in customer concerns and works closely with the project management teams on prioritising tasks and managing customer escalations.</li><li>Developing strategies for churned accounts.</li><li>Track status for renewal commitment and proactively reach out to customers as required.</li><li>Implemented new processes which improve renewal forecasting accuracy.</li></ul>'''
          if old not in s:
              raise SystemExit('Expected Lead CSM bullet block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update Lead CSM experience details'
          git push