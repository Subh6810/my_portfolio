name: Update vidaXL experience details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace vidaXL bullets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<ul><li>Analysed customer feedback and mapped delivery and returns journeys to identify service gaps.</li><li>Partnered with Product, Operations, Logistics and Customer Service teams to resolve issues and improve service delivery.</li><li>Used root-cause analysis and CX metrics to support continuous improvement.</li><li>Contributed to a <b>15% reduction</b> in recurring complaints and <b>20% increase</b> in customer engagement.</li></ul>'''
          new = '''<ul><li>Analysed customer feedback across platforms to identify service gaps and improvement areas.</li><li>Mapped customer journeys across delivery and returns processes to improve customer experience and operational efficiency.</li><li>Worked closely with Product, Operations, Logistics, and Customer Service teams to resolve customer issues and enhance service delivery.</li><li>Conducted root-cause analysis of recurring customer complaints and supported process improvement initiatives.</li><li>Monitored customer experience metrics and trends to drive continuous improvements in customer satisfaction.</li><li>Supported Web care strategy implementation and continuous optimisation.</li><li>Contributed to reducing recurring customer complaints by <b>15%</b> and increasing customer engagement by <b>20%</b> through customer-focused improvement initiatives.</li></ul>'''
          if old not in s:
              raise SystemExit('Expected vidaXL bullet block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update vidaXL experience details from resume'
          git push