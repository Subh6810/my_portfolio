name: Update REVE Systems experience details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace REVE Systems bullets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<ul><li>Owned retention and growth for valuable customers and acted as a voice of the customer.</li><li>Led and developed a team of <b>8–10 Customer Success Managers</b>.</li><li>Created customised AI chatbots for unique customer requirements and supported integrations.</li><li>Partnered with Sales on pilots, renewals and expansion opportunities and conducted QBRs.</li><li>Led chatbot customisation and integration initiatives that increased user satisfaction by <b>20%</b>.</li></ul>'''
          new = '''<ul><li>Drive retention and growth among our most valuable customers by understanding their business needs and helping them succeed.</li><li>Identify opportunities for customers to act as REVE Chat advocates (e.g. testimonials, case studies, Newsletters).</li><li>Directed and developed a team of <b>8–10 Customer Success Managers</b>, driving operational excellence, strategic account growth, and continuous performance improvement.</li><li>Preparing customised AI chatbots to cater to the unique requirements of each customer's business.</li><li>Collaborate closely with Sales to support pilot customers, renewals, and expansion opportunities.</li><li>Conducted Quarterly Business Reviews with customer stakeholders.</li><li>Acted as customer advocate, contributing feedback to product and sales teams.</li><li>Led AI chatbot customisation and integration, increasing user satisfaction by <b>20%</b>.</li><li><b>Client Regions:</b> USA, South America, UK, APAC, EMEA, Middle East</li></ul>'''
          if old not in s:
              raise SystemExit('Expected REVE Systems bullet block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update REVE Systems experience details from resume'
          git push