name: Update customer success approach
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace How I work text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Understand the customer goal → diagnose the problem → align internal teams → execute the solution → measure the outcome → build long-term adoption.'
          new = 'Align with customer goals → Create a clear success plan → Build executive relationships → Drive adoption and value → Identify risks early → Deliver measurable outcomes → Expand the partnership'
          if old not in s:
              raise SystemExit('Old How I work text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update How I work section'
          git push